  #   depends_on:
  #     - postgres
  #   networks:
  #     - app-network
  #   profiles:
  #     - tools

  # ------------------------------------------------------------
  # Optional: Redis for Caching / Rate Limiting / Sessions
  # ------------------------------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   container_name: project-security-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
